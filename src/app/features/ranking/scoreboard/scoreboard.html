<div class="scoreboard-root">
  <section class="ui-hero hero">
    <h1 class="ui-title title">Brettspiel <span class="ui-accent">Ranking</span></h1>
    <div class="ui-badge">
      Runde {{ ((roundCount$ | async) ?? 0) + 1 }}
    </div>
  </section>

  <div class="list">
    <mat-card *ngFor="let p of players$ | async; let rank = index; trackBy: trackById" class="player-card ui-surface">
      <div class="mat-card-wrapper">
        <div class="info">
          <div class="player-heading">
            <span class="rank-badge">{{ rank + 1 }}</span>
            <div class="name">{{ p.name }}</div>
          </div>
          <div class="score">
            <span>{{ p.score }}</span> points
          </div>
        </div>
        <mat-form-field appearance="outline" class="score-field" subscriptSizing="dynamic">
          <mat-label>Score</mat-label>
          <input matInput type="number" min="0" [ngModel]="roundScores[p.id]"
            (ngModelChange)="setRoundScore(p.id, $event)" aria-label="Points for this round" />
        </mat-form-field>
      </div>
    </mat-card>
  </div>

  <div class="footer">
    <button mat-flat-button color="primary" class="ui-button round-button" (click)="nextRound()">
      <mat-icon aria-hidden="true">arrow_forward</mat-icon>
      In die nächste Runde
    </button>

    <button *ngIf="hasCompletedRound" mat-stroked-button class="ui-button danger-button" (click)="endGame()">
      Spiel beenden
      <mat-icon aria-hidden="true">flag</mat-icon>
    </button>
  </div>
</div>
