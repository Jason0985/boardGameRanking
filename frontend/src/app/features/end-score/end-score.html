<div class="end-score-root">
  <header class="end-header">
    <div class="badge">Spiel beendet</div>
    <h1>Endpunktestand</h1>
    <p>Das finale Ranking der Runde.</p>
  </header>

  <mat-card
    *ngFor="let player of players$ | async; let rank = index; trackBy: trackById">
    <div class="ranking-card">
    <div class="player-info">
      <div class="rank-badge">{{ rank + 1 }}</div>
      <div class="player-name">{{ player.name }}</div>
    </div>
    <div class="score">
      <div class="player-score">{{ player.score }} <span>Pkt.</span></div>
    </div>
    </div>
  </mat-card>

  <button mat-flat-button color="warn" class="new-game-button" (click)="startNewGame()">
    <mat-icon>replay</mat-icon>
    Neues Spiel starten
  </button>
</div>
