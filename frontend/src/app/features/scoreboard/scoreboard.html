<div class="scoreboard-root">
  <section class="hero">
    <div class="badge">Von Jason</div>
    <h1 class="title">Board Game <span class="accent">Scoreboard</span></h1>
    <p class="subtitle">Track every round, keep the table moving.</p>
  </section>

  <mat-card class="add-card">
    <mat-card-content class="top">
      <mat-form-field appearance="outline" class="name-field">
        <input matInput placeholder="Player name" [(ngModel)]="name" (keyup.enter)="add()" />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="add()">Add player</button>
    </mat-card-content>
  </mat-card>

  <div class="list">
    <mat-card *ngFor="let p of players$ | async; let rank = index; trackBy: trackById" class="player-card">
      <div class="info">
        <div class="player-heading">
          <span class="rank-badge">{{ rank + 1 }}</span>
          <div class="name">{{ p.name }}</div>
        </div>
        <div class="score">
          <span>{{ p.score }}</span> points
        </div>
      </div>
      <mat-form-field appearance="outline" class="score-field">
        <mat-label>Score</mat-label>
        <input
          matInput
          type="number"
          min="0"
          [ngModel]="p.score"
          #scoreInput
          (change)="setScore(p, scoreInput.value)"
          aria-label="Player score"
        />
      </mat-form-field>
    </mat-card>
  </div>

  <div class="footer">
    <button mat-stroked-button color="accent" (click)="reset()">
      <mat-icon>restart_alt</mat-icon>
      New round
    </button>
  </div>
</div>
